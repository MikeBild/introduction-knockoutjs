<h1>Todos mit Knockout, TypeScript und Vite</h1>
<form data-bind="submit: add">
  <label>Neue Aufgabe <input data-bind="textInput: newText" autofocus /></label>
  <button type="submit">Hinzufügen</button>
</form>
<ul data-bind="foreach: todos">
  <li><todo-item params="todo: $data, onRemove: $parent.remove"></todo-item></li>
</ul>
<!-- ko if: todos().length > 0 -->
<p>Noch <span data-bind="text: remaining"></span> offen</p>
<!-- /ko -->
<button type="button" data-bind="click: removeCompleted, enable: remaining() < todos().length">
  Erledigte entfernen
</button>
